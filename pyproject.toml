[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inbox-reaper"
version = "0.1.0"
description = "Email classification and cleaning system using hybrid deterministic + AI pipeline"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aioimaplib>=2.0.3",
    "authlib>=1.9.1",
    "click>=8.5.0",
    "keyring>=25.7.0",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "mlx-lm>=0.32.2",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "ruff>=0.17.2",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pre-commit>=4.7.0",
    "types-Authlib>=1.8.0",
    "types-PyYAML>=6.0.12",
    "types-requests>=2.33.0",
]

[project.scripts]
inbox-reaper = "inbox_reaper.cli:main"
setup-dev = "inbox_reaper.scripts:setup_dev"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RET", # flake8-return
    "PIE", # flake8-pie
    "PTH", # prefer pathlib
    "FURB", # refurb (modern idioms)
    "RUF", # ruff-specific
    "TRY400", # logger.exception inside except blocks
]
ignore = [
    "RUF001", # intentional unicode (e.g. ✓) in CLI output
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "PTH", "RUF012"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
files = ["src"]

[[tool.mypy.overrides]]
module = "aioimaplib"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mlx_lm"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "inbox_reaper.ui.events"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -W error"
