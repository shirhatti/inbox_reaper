[project]
name = "inbox-reaper"
version = "0.1.0"
description = "Email classification and cleaning system using hybrid deterministic + AI pipeline"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.1.0",
    "google-genai>=0.3.0",
    "ollama>=0.1.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
linux = [
    "secretstorage>=3.3.0",  # For Linux Secret Service (GNOME Keyring, KWallet)
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "black>=24.10.0",
    "mypy>=1.14.0",
    "pytest>=8.0.0",
    "pre-commit>=4.0.0",
]

[project.scripts]
inbox-reaper = "inbox_reaper.cli:main"
setup-dev = "inbox_reaper.scripts:setup_dev"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.black]
target-version = ["py313"]
line-length = 88
include = '\.pyi?$'

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
files = ["src"]
